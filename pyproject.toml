[project]
name = "bug-locator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.59.0",
    "python-dotenv>=1.2.4",
    "traceroot==0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["test_tools.py", "test_agent.py"]
norecursedirs = ["data", ".venv"]
